<style>
/* Layout: mobile-first. Тёмная шапка, оранжевая полоса с паэльерой на главной, одна колонка до 46rem,
   нижняя панель вкладок под большой палец; от 900px панель уходит в шапку */
:root {
  --paprika: #dd7e31;      /* фон афиши */
  --saffron: #f6b23a;      /* рис */
  --ink: #2b2034;          /* буквы афиши */
  --cream: #f0ddb8;        /* уголок с датами */
  --band-bg: #dd7e31;
  --band-fg: #2b2034;
  --band-soft: #f0ddb8;

  --bg: #fdf7ec;
  --surface: #ffffff;
  --surface-2: #f8eedb;
  --fg: #2b2034;
  --muted: #6e6074;
  --line: #ead9bb;
  --accent: #b4561a;
  --accent-fg: #ffffff;
  --pressed-bg: #2b2034;
  --pressed-fg: #f0ddb8;
  --now-bg: #2b2034;
  --now-fg: #f0ddb8;
  --now-em: #f6b23a;
  --take: #6f8f22;
  --miss: #c9b9a6;
  --lead-bg: color-mix(in srgb, var(--saffron) 16%, var(--surface));
  --lead-sum: color-mix(in srgb, var(--saffron) 36%, var(--surface));
  --warn-bg: #fdecc6;
  --warn-fg: #6f4400;
  --k-chgk: #2b2034;
  --k-ksi: #6f8f22;
  --k-ek: #b4561a;
  --k-rioja: #8a2442;
  --focus: #2b2034;
  --tabbar-h: 64px;

  --f-display: "Rubik", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --f-ui: "Fira Sans Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif; /* узкий: больше влезает в строку */
  --f-body: var(--f-ui);
  --r: 14px;
  --wrap: 46rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #19131e; --surface: #241c2b; --surface-2: #2d2335; --fg: #f4e7cd; --muted: #b6a7b9;
    --line: #3b3045; --accent: #f0914a; --accent-fg: #1c1520; --pressed-bg: #f6b23a; --pressed-fg: #2b2034;
    --now-bg: #dd7e31; --now-fg: #2b2034; --now-em: #2b2034; --take: #a9c95a; --miss: #5d5068;
    --warn-bg: #4a3613; --warn-fg: #f6d18c; --k-chgk: #f4e7cd; --k-ksi: #a9c95a; --k-ek: #f0914a; --k-rioja: #f08aa8;
    --focus: #f6b23a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #19131e; --surface: #241c2b; --surface-2: #2d2335; --fg: #f4e7cd; --muted: #b6a7b9;
  --line: #3b3045; --accent: #f0914a; --accent-fg: #1c1520; --pressed-bg: #f6b23a; --pressed-fg: #2b2034;
  --now-bg: #dd7e31; --now-fg: #2b2034; --now-em: #2b2034; --take: #a9c95a; --miss: #5d5068;
  --warn-bg: #4a3613; --warn-fg: #f6d18c; --k-chgk: #f4e7cd; --k-ksi: #a9c95a; --k-ek: #f0914a; --k-rioja: #f08aa8;
  --focus: #f6b23a; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 400 1rem/1.5 var(--f-body);
  padding-bottom: calc(var(--tabbar-h) + 8px + env(safe-area-inset-bottom, 0px)); }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15; }
h3 { font-family: var(--f-ui); font-weight: 600; }
p { margin: 0; }
.wrap { max-width: var(--wrap); margin-inline: auto; padding-inline: 16px; }
.nowrap { white-space: nowrap; }
.muted { color: var(--muted); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Шапка */
.top { --focus: var(--saffron); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ink); color: var(--cream); }
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 52px; max-width: 72rem; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font: 800 1.05rem/1 var(--f-display); white-space: nowrap; min-height: 48px; }
.brand svg { width: 36px; height: 16px; flex: none; }
.topnav { display: none; margin-left: auto; gap: 4px; }
.topnav a { text-decoration: none; padding: 8px 12px; border-radius: 999px; font: 500 .92rem/1 var(--f-ui); color: var(--cream); opacity: .82; }
.topnav a:hover { opacity: 1; }
.topnav a[aria-current="page"] { opacity: 1; background: var(--saffron); color: var(--ink); }

/* Нижняя панель вкладок */
.tabbar { --focus: var(--saffron); position: fixed; inset: auto 0 0 0; z-index: 20; background: var(--ink); color: var(--cream);
  padding-bottom: env(safe-area-inset-bottom, 0px); display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid rgba(240, 221, 184, .12); }
.tabbar a { display: grid; justify-items: center; align-content: center; gap: 4px; min-height: var(--tabbar-h); text-decoration: none;
  font: 600 .7rem/1 var(--f-ui); letter-spacing: .02em; opacity: .72; }
.tabbar svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tabbar a[aria-current="page"] { opacity: 1; color: var(--saffron); }
.tabbar a:focus-visible { outline-offset: -4px; }
/* невысокие телефоны (iPhone SE, бюджетные Android): паэльера меньше, чтобы «Сейчас / Далее» было видно сразу */
@media (max-width: 759px) and (max-height: 700px) { .hero h1 img { width: min(50vw, 190px); } .hero .wrap { gap: 8px; } }
/* узкие экраны 360px: переключатель зачёта и «Расплюсовка» в одну строку */
@media (max-width: 380px) { #chgk-box .tbtn { font-size: .85rem; } }
@media (max-width: 560px) { .results-head { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } }
/* телефон боком: шапка не липнет, нижняя панель ниже — больше места таблице */
@media (max-height: 500px) and (orientation: landscape) {
  :root { --tabbar-h: 48px; }
  .top { position: static; }
  .tabbar a { grid-auto-flow: column; gap: 6px; font-size: .74rem; }
  .tabbar svg { width: 20px; height: 20px; }
  .results-head { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .day h2 { top: 0; }
}
@media (min-width: 900px) {
  body { padding-bottom: 0; }
  .tabbar { display: none; }
  .topnav { display: flex; }
}

.strip { font-size: .8125rem; background: var(--surface-2); color: var(--muted); }
.strip .wrap { padding-block: 8px; max-width: 72rem; }
.strip b { font-weight: 600; }

/* Главная */
.hero { --focus: var(--ink); background: var(--band-bg); color: var(--band-fg); }
.hero .wrap { display: grid; gap: 12px; padding-block: 10px 20px; max-width: 72rem; }
.hero h1 img { display: block; width: min(64vw, 260px); height: auto; margin-inline: auto; }
/* обе строки названия — одного размера (просьба организаторов) */
.hero .eyebrow, .hero .champ { font: 800 1.3rem/1.15 var(--f-display); text-wrap: balance; }
.hero .champ { margin-top: .6em; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.hero .dates { display: inline-block; background: var(--band-soft); font: 800 1.3rem/1.1 var(--f-display); padding: 9px 14px 8px; border-radius: 10px; transform: rotate(-2deg); }
.hero .countdown { font: 700 .95rem/1.3 var(--f-ui); }
.hero .venue { display: grid; gap: 2px; }
.hero .venue b { font: 700 1.05rem/1.3 var(--f-ui); }
.hero .venue a { font-weight: 500; justify-self: start; padding-block: 6px; }
@media (min-width: 760px) {
  .hero .wrap { grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); align-items: center; gap: 20px 40px; padding-block: 28px 40px; }
  .hero h1 img { width: min(100%, 500px); }
  .hero .eyebrow, .hero .champ { font-size: 2.1rem; }
}

.main { padding-block: 20px 36px; display: grid; gap: 18px; }
.main > *, #chgk-box > * { min-width: 0; }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; text-decoration: none; border: 0; cursor: pointer;
  min-height: 50px; padding: 12px 18px; border-radius: 14px; font: 700 1rem/1.2 var(--f-ui); }
.btn-main { background: var(--accent); color: var(--accent-fg); }
.btn-soft { background: var(--surface); color: var(--fg); border: 1px solid var(--line); }
.btns { display: grid; gap: 10px; }
@media (min-width: 560px) { .btns.two { grid-template-columns: 1fr 1fr; } }

/* Сейчас / Далее */
.now { background: var(--now-bg); color: var(--now-fg); border-radius: var(--r); padding: 16px 18px; display: grid; gap: 12px; }
.now .row { display: grid; gap: 2px; }
.now .lbl { font: 700 .72rem/1.2 var(--f-ui); letter-spacing: .12em; text-transform: uppercase; color: var(--now-em); }
.now .what { font: 700 1.15rem/1.25 var(--f-ui); }
.now .when { font-size: .92rem; opacity: .85; }
.now a { color: inherit; font-weight: 600; }
.now a.more { justify-self: start; padding-block: 12px 4px; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { display: grid; gap: 4px; align-content: start; text-decoration: none; padding: 14px 16px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); min-height: 92px; }
.tile h2 { font-size: 1.05rem; font-weight: 800; }
.tile p { font-size: .86rem; color: var(--muted); }
.tile p b { color: var(--fg); font-weight: 600; }

/* Заголовки страниц */
.page-head h1 { font-size: 1.85rem; font-weight: 900; }
.page-head .sub { color: var(--muted); margin-top: 6px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.empty { padding: 18px; color: var(--muted); display: grid; gap: 12px; }
.empty b { color: var(--fg); }

/* Сегменты (подразделы результатов) */
.seg { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); }
.seg a, .seg button { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; text-align: center; white-space: nowrap; text-decoration: none; border: 0; background: transparent; color: var(--fg);
  min-height: 40px; padding: 6px 4px; border-radius: 10px; font: 600 .9rem/1.15 var(--f-ui); cursor: pointer; }
.seg [aria-current="page"], .seg [aria-pressed="true"] { background: var(--pressed-bg); color: var(--pressed-fg); }

/* Программа */
.day { display: grid; gap: 8px; }
.day h2 { position: sticky; top: calc(52px + env(safe-area-inset-top, 0px)); z-index: 5; background: var(--bg); padding-block: 8px 4px; font-size: 1.2rem; font-weight: 800; }
.slots { display: grid; }
.slot { display: grid; grid-template-columns: 4.6rem minmax(0, 1fr); gap: 2px 14px; padding: 12px 16px; border-left: 4px solid transparent; }
.slot + .slot { border-top: 1px solid var(--line); }
.slot .t { font: 700 1rem/1.35 var(--f-ui); font-variant-numeric: tabular-nums; }
.slot .t span { display: block; font-weight: 500; font-size: .82rem; color: var(--muted); }
.slot h3 { font-size: 1.02rem; font-weight: 700; line-height: 1.3; }
.slot p { color: var(--muted); font-size: .9rem; margin-top: 2px; }
.slot.k-chgk { border-left-color: var(--k-chgk); }
.slot.k-ksi { border-left-color: var(--k-ksi); }
.slot.k-ek { border-left-color: var(--k-ek); }
.slot.k-rioja { border-left-color: var(--k-rioja); }
.slot.k-break h3 { font-weight: 500; color: var(--muted); }
.slot.is-now { background: var(--lead-bg); }
.slot .live { display: inline-block; margin-left: 6px; font: 700 .72rem/1 var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); vertical-align: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .8rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* Команды */
input[type="search"] { font: inherit; width: 100%; min-height: 46px; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.teams { display: grid; }
.team { display: grid; grid-template-columns: 2.2rem minmax(0, 1fr); gap: 2px 10px; padding: 12px 16px; align-items: baseline; }
.team + .team { border-top: 1px solid var(--line); }
.team .n { font: 600 .9rem/1.3 var(--f-ui); color: var(--muted); font-variant-numeric: tabular-nums; }
.team .name { font: 700 1.05rem/1.3 var(--f-ui); }
.team .name a { text-decoration-color: var(--line); text-underline-offset: 3px; display: inline-block; padding-block: 10px; margin-block: -10px; }
.team .where { grid-column: 2; font-size: .88rem; color: var(--muted); }
.pending { display: inline-block; font: 600 .7rem/1 var(--f-ui); padding: 4px 7px; border-radius: 999px; background: var(--warn-bg); color: var(--warn-fg); vertical-align: 2px; margin-left: 4px; white-space: nowrap; }
.bat-mini { display: inline-block; width: 18px; height: 8px; color: var(--muted); vertical-align: 2px; margin-left: 5px; }
.bat-mini svg { display: block; width: 100%; height: 100%; }

/* Результаты ЧГК */
.scroll { position: relative; overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: separate; border-spacing: 0; width: 100%; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
th { font: 600 .7rem/1.2 var(--f-ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
tbody tr:last-child td { border-bottom: 0; }
.res { --w-left: 18rem; --w-place: 2.8rem; --w-sum: 3.2rem; font-variant-numeric: tabular-nums; }
.res .c-left, .res .c-sum { position: sticky; z-index: 1; background: var(--surface); padding: 0; }
.res .c-left { left: 0; }
.res .c-sum { left: var(--w-left); background: var(--surface-2); box-shadow: inset -1px 0 0 var(--line); }
/* ширину задаёт внутренний блок: ячейка не может стать шире, и закреплённые столбцы не наезжают друг на друга */
.res .cl { width: var(--w-left); display: grid; grid-template-columns: var(--w-place) minmax(0, 1fr); column-gap: 6px; align-items: center; padding: 7px 8px 7px 12px; white-space: normal; }
.res .cl .pl { font: 700 .95rem/1.2 var(--f-ui); white-space: nowrap; overflow: hidden; }
.res .cl .pl .move { display: block; margin: 1px 0 0; }
.res .cl b { font: 600 1rem/1.2 var(--f-ui); display: block; overflow-wrap: anywhere; }
.res .cl .city { display: block; color: var(--muted); font-size: .8rem; line-height: 1.25; }
.res .cs { width: var(--w-sum); text-align: center; padding: 7px 0; }
.res td .cs { font: 700 1.15rem/1.3 var(--f-ui); }
.res thead .cs { color: var(--fg); font-size: .95rem; }
.res .tr { text-align: center; font: 500 1.05rem/1.3 var(--f-ui); min-width: 2.7rem; }
.res td.tr.future { color: var(--muted); }
.res th.tr button { border: 0; background: transparent; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; min-height: 40px; padding: 4px 6px; border-radius: 8px; }
.res th.q, .res td.q { padding: 9px 2px; text-align: center; min-width: 1.5rem; }
.res th.q { font-size: .72rem; letter-spacing: 0; }
.res .q.first { padding-left: 10px; }
.mk { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: middle; }
.mk.y { background: var(--take); }
.mk.n { background: var(--miss); width: 7px; height: 7px; }
.mk.x { box-shadow: inset 0 0 0 1.5px var(--miss); width: 7px; height: 7px; }
.res tfoot td { color: var(--muted); font-size: .76rem; border-top: 2px solid var(--line); border-bottom: 0; }
.res tr.lead td { background: var(--lead-bg); }
.res tr.lead td.c-sum { background: var(--lead-sum); }
.res thead th { vertical-align: middle; }
.move { font-size: .72rem; margin-left: 3px; }
.move.up { color: var(--take); }
.move.down { color: var(--accent); }
.status { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: .88rem; color: var(--muted); }
.status .big { display: inline-flex; align-items: center; gap: 8px; font: 700 1.05rem/1.3 var(--f-ui); color: var(--fg); }
.live-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--take); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--take) 60%, transparent); } 70% { box-shadow: 0 0 0 8px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .live-dot { animation: none; } }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tbtn { display: inline-flex; align-items: center; justify-content: center; border: 0; background: var(--surface-2); color: var(--fg); min-height: 48px; padding: 8px 14px; border-radius: 14px; font: 600 .9rem/1 var(--f-ui); cursor: pointer; }
.tbtn[aria-pressed="true"] { background: var(--pressed-bg); color: var(--pressed-fg); }
.pills { flex: 1 1 auto; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; max-width: 34rem; }
.pills .tbtn { width: 100%; padding-inline: 6px; white-space: nowrap; }
.gen th:first-child, .gen td:first-child { position: sticky; left: 0; background: var(--surface); z-index: 1; }
@media (max-width: 560px) {
  .wide { display: none; }
  .res-card { margin-inline: -16px; border-radius: 0; border-inline: 0; }
  .res .tools { gap: 6px; }
}
@media (max-width: 420px) {
  .res { --w-left: 9.9rem; --w-place: 2.25rem; --w-sum: 2.6rem; }
  .res .cl { padding-left: 10px; column-gap: 4px; }
  .res .cl .pl { font-size: .9rem; }
  .res .tr { min-width: 2.45rem; }
  .res th.tr button { padding-inline: 2px; font-size: .7rem; letter-spacing: 0; }
}
.res abbr { text-decoration: none; font-weight: 600; }

/* во весь экран: строки прижаты кверху, лишняя высота не раздувает статус и кнопки */
#chgk-box:fullscreen { background: var(--bg); padding: 20px; overflow: auto; align-content: start; }

/* Эрудит-квартет */
.bracket { display: grid; gap: 10px; }
.stage { display: grid; gap: 6px; }
.stage h3 { font-size: .8rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.match { display: flex; justify-content: space-between; gap: 12px; padding: 12px 16px; }
.match + .match { border-top: 1px solid var(--line); }
.match b { font: 700 1rem/1.3 var(--f-ui); }

.game { padding: 4px 0; }

<script>
// Сайт читает документы организаторов сам. Главный — «Мини-сайт Кубка Паэльи»: в нём заголовок, даты,
// место и ссылки на расписание, участников, результаты и формы. Поменяли там ссылку — поменялся сайт.
const HUB_DOC = '1LeZhBYW-NThLFOwi9iZsd1vmK8R-hM0kGJvwLzcqlmY';
const REFRESH_SEC = 30;
const hms = d => d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
const SNAP = window.SNAPSHOT;

const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s ?? '').trim().toLowerCase().replace(/ё/g, 'е').replace(/[*]+$/, '').replace(/\s+/g, ' ').trim();
const nb = s => String(s ?? '').replace(/(^|[\s(«])([а-яёa-z]{1,2}|\d+)\s/gi, '$1$2 ').replace(/\s([—€])/g, ' $1');
const t = s => esc(nb(s));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const quotes = s => String(s ?? '').replace(/"([^"]*)"/g, '«$1»');
const listJoin = a => a.length > 1 ? `${a.slice(0, -1).join(', ')} и ${a.at(-1)}` : (a[0] || '');
// значок мыши не отрывается от последнего слова названия
function withBat(name, local) {
  name = esc(name); if (!local) return name;
  const bat = `<span class="bat-mini" role="img" aria-label="из Валенсии">${batSvg()}</span>`, i = name.lastIndexOf(' ');
  return i < 0 ? `<span class="nowrap">${name}${bat}</span>` : `${name.slice(0, i + 1)}<span class="nowrap">${name.slice(i + 1)}${bat}</span>`;
}
const batSvg = () => `<svg viewBox="0 2 64 24" aria-hidden="true"><use href="#bat"/></svg>`;
function plural(n, one, few, many) {
  n = Math.abs(n) % 100; const d = n % 10;
  if (n > 10 && n < 20) return many; if (d > 1 && d < 5) return few; if (d === 1) return one; return many;
}
const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
const ROUTES = { '': 'home', schedule: 'schedule', teams: 'teams', results: 'results', ksi: 'results', ek: 'results', info: 'info' };
const curPage = () => { const h = (location.hash || '').slice(1); return h in ROUTES ? h : ''; };

/* ---------- Чтение Google-документов ---------- */
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
async function fetchText(url) {
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error('нет доступа');
  const txt = await r.text();
  if (/^\s*</.test(txt)) throw new Error('нет доступа'); // страница входа Google вместо данных
  return txt.replace(/^﻿/, '');
}
const docUrl = id => `https://docs.google.com/document/d/${id}/export?format=txt`;
const sheetId = link => link?.match(/spreadsheets\/d\/([\w-]+)/)?.[1];
// headers: сколько строк сверху считать заголовком (0 — читать всё как данные); без него Google угадывает сам и иногда теряет подписи колонок
function sheetUrl(link, tab, headers) {
  const id = sheetId(link); if (!id) return null;
  const gid = link.match(/[#&?]gid=(\d+)/)?.[1];
  const which = tab ? `&sheet=${encodeURIComponent(tab)}` : gid ? `&gid=${gid}` : '';
  return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv${which}${headers != null ? `&headers=${headers}` : ''}&t=${Date.now()}`;
}
const docId = link => link?.match(/document\/d\/([\w-]+)/)?.[1];
const getRows = async (link, tab, headers) => { const u = link && sheetUrl(link, tab, headers); if (!u) return null; try { return parseCSV(await fetchText(u)); } catch { return null; } };

/* ---------- Разбор «Мини-сайта» ---------- */
function parseHub(txt) {
  const lines = txt.split(/\r?\n/).map(s => s.replace(/ /g, ' ').trim());
  const cfg = { title: [], dates: '', venue: '', map: '', links: {}, notReady: new Set() };
  let block = '', lastKey = null;
  for (const line of lines) {
    if (!line) continue;
    const head = line.match(/^(заголовок|информация|разделы)\s*:?\s*(.*)$/i);
    if (head) { block = head[1].toLowerCase(); if (head[2]) cfg.title.push(head[2]); continue; }
    const url = line.match(/https?:\/\/\S+/)?.[0];
    const label = (url ? line.slice(0, line.indexOf(url)) : line).replace(/\(пока не готово\)/i, '').replace(/^upd\d*\s*[-–—:]?\s*/i, '').replace(/[\s\-–—:]+$/, '').trim();
    if (/^даты[^:]*:/i.test(line)) { cfg.dates = line.replace(/^даты[^:]*:\s*/i, ''); continue; }
    if (/^место[^:]*:/i.test(label)) { cfg.venue = label.replace(/^место[^:]*:\s*/i, ''); cfg.map = url || ''; continue; }
    if (block === 'заголовок' && !url) { cfg.title.push(label); continue; }
    let key = null;
    if (/спорн/i.test(label)) key = 'formDisputed';
    else if (/апелляц/i.test(label)) key = 'formAppeal';
    else if (/состав/i.test(label)) key = 'formSquads';
    else if (/регистрац|дисциплин/i.test(label)) key = 'formReg';
    else if (/^результат/i.test(label)) key = /кси|своя/i.test(label) ? 'ksi' : /эрудит/i.test(label) ? 'ek' : 'chgk';
    else if (/правил|регламент|положени/i.test(label)) key = 'rules';
    else if (/расписан|программ/i.test(label)) key = 'schedule';
    else if (/участник|команд/i.test(label)) key = 'teams';
    if (key) lastKey = key;
    else if (url) key = lastKey; // «UPD1 - вот ссылка…» и голая ссылка — к разделу выше
    if (!key) continue;
    if (url) { cfg.links[key] = url; cfg.notReady.delete(key); } else if (/не готово/i.test(line)) cfg.notReady.add(key);
  }
  // «Международный фестиваль … Кубок Паэльи - 2026.» → надзаголовок + название
  const t1 = (cfg.title[0] || 'Кубок Паэльи').replace(/\s+/g, ' ').replace(/\.$/, '').replace(/\s-\s/g, ' — ');
  const i = t1.indexOf('Кубок');
  cfg.eyebrow = i > 0 ? t1.slice(0, i).trim() : '';
  cfg.name = i >= 0 ? t1.slice(i) : t1;
  cfg.champ = quotes((cfg.title[1] || '').replace(/\s+/g, ' ').replace(/\.$/, ''));
  cfg.datesText = cfg.dates.replace(/(\d)\s*[-–—]\s*(\d)/, '$1–$2').replace(/\s*(года|г)\.?$/i, '');
  cfg.year = cfg.dates.match(/\d{4}/)?.[0] || String(new Date().getFullYear());
  return cfg;
}

/* ---------- Разбор расписания ---------- */
const WD = /(понедельник|вторник|среда|четверг|пятница|суббота|воскресенье)/i;
const SLOT_RE = /^(\d{1,2})[:.](\d{2})\s*(?:[–—-]\s*(\d{1,2})[:.](\d{2}))?\.?\s+(.+)$/;
const hm = (h, m) => +h * 60 + +m;
const fmt = min => `${Math.floor(min / 60)}:${String(min % 60).padStart(2, '0')}`;
function kindOf(s) {
  if (/перерыв/i.test(s)) return 'break';
  if (/риох/i.test(s)) return 'rioja';
  if (/эрудит/i.test(s)) return 'ek';
  if (/своя игра|кси/i.test(s)) return 'ksi';
  if (/чгк|перестрелк|награжд/i.test(s)) return 'chgk';
  return 'other';
}
function parseSchedule(txt, year) {
  const days = [];
  for (const raw of txt.split(/\r?\n/)) {
    const line = raw.replace(/ /g, ' ').trim().replace(/^[•*\-–—]\s*/, '');
    if (!line) continue;
    const s = line.match(SLOT_RE);
    if (s && days.length && !WD.test(line)) {
      const [, h1, m1, h2, m2, title] = s;
      days.at(-1).items.push({ from: hm(h1, m1), to: h2 ? hm(h2, m2) : null, title: title.trim().replace(/\.$/, ''), notes: [], kind: kindOf(title) });
      continue;
    }
    const wd = line.match(WD);
    const dn = line.match(/(\d{1,2})\.(\d{1,2})(?:\.(\d{4}))?/);
    const dw = line.match(new RegExp(`(\\d{1,2})\\s+(${MONTHS.join('|')})`, 'i'));
    if (wd && (dn || dw) && line.length < 60) {
      const dd = +(dn ? dn[1] : dw[1]), mm = dn ? +dn[2] : MONTHS.indexOf(dw[2].toLowerCase()) + 1, yyyy = dn?.[3] || year;
      const w = wd[1].toLowerCase();
      days.push({ label: `${cap(w)}, ${dd} ${MONTHS[mm - 1]}`, weekday: w, date: `${yyyy}-${String(mm).padStart(2, '0')}-${String(dd).padStart(2, '0')}`, items: [], notes: [] });
      continue;
    }
    const day = days.at(-1); if (!day) continue;
    const note = line.replace(/^место проведения\s*[–—-]\s*/i, 'Где: ').replace(/(\d{1,2})\.(\d{2})\b/g, '$1:$2');
    (day.items.length ? day.items.at(-1).notes : day.notes).push(note);
  }
  return days;
}

// число вопросов в турах ЧГК — официальное, с турнирного сайта (в документе с расписанием может отставать)
function officialTourSizes(days) {
  const sizes = SNAP.rating?.tours || [];
  for (const d of days) for (const it of d.items) {
    it.title = it.title.replace(/(\d+)(-й\s*тур\s*ЧГК\D*?)(\d+)(\s*вопрос\S*)/i, (m, k, mid, n, tail) => {
      const q = sizes[+k - 1];
      return q ? `${k}${mid}${q} ${plural(q, 'вопрос', 'вопроса', 'вопросов')}` : m;
    });
  }
}

/* ---------- Разбор участников ---------- */
function parseTeams(csv) {
  const rows = parseCSV(csv);
  const h = rows.findIndex(r => r.some(c => /назван/i.test(c)));
  if (h < 0) return { list: [], notes: [] };
  const head = rows[h].map(c => norm(c));
  const col = re => head.findIndex(c => re.test(c));
  const ci = { name: col(/назван/), country: col(/стран/), city: col(/город/), id: col(/(^|\s)id(\s|$)|айди|рейтинг|номер на/) };
  const body = rows.slice(h + 1).filter(r => String(r[ci.name] ?? '').trim());
  // если первая колонка — порядковый номер, строки без номера считаем примечаниями
  const numbered = ci.name > 0 && body.filter(r => /^\d+$/.test(String(r[0]).trim())).length > body.length / 2;
  const list = [], notes = [];
  for (const r of body) {
    const name = String(r[ci.name]).trim();
    if (name.startsWith('*') || (numbered && !String(r[0]).trim())) { notes.push(name); continue; }
    const v = k => ci[k] >= 0 ? String(r[ci[k]] ?? '').trim() : '';
    list.push({ name: name.replace(/\*+$/, '').trim(), country: v('country'), city: v('city'), id: v('id').replace(/\D/g, ''), pending: /\*$/.test(name) });
  }
  return { list, notes };
}

/* ---------- Состояние ---------- */
const S = { mode: 'snapshot', cfg: null, days: [], teams: [], teamNotes: [], chgk: null, tourTabs: {}, ksi: null, ek: null, rulesTxt: null, at: null, loadedAt: 0 };

async function loadBase() {
  let hub;
  try { hub = await fetchText(docUrl(HUB_DOC)); S.mode = 'live'; }
  catch { if (S.cfg) return; hub = SNAP.hub; S.mode = 'snapshot'; }
  S.cfg = parseHub(hub);
  const L = S.cfg.links, live = S.mode === 'live';
  const [teamsCsv, schedTxt, rulesTxt] = await Promise.all([
    live && L.teams ? fetchText(sheetUrl(L.teams)).catch(() => null) : null,
    live && docId(L.schedule) ? fetchText(docUrl(docId(L.schedule))).catch(() => null) : null,
    live && docId(L.rules) ? fetchText(docUrl(docId(L.rules))).catch(() => null) : null,
  ]);
  if (rulesTxt) S.rulesTxt = rulesTxt;
  if (teamsCsv || !S.teams.length) { const tm = parseTeams(teamsCsv || SNAP.teams); S.teams = tm.list; S.teamNotes = tm.notes; }
  const days = schedTxt ? parseSchedule(schedTxt, S.cfg.year) : [];
  if (days.length) S.days = days; else if (!S.days.length) S.days = parseSchedule(SNAP.schedule, S.cfg.year);
  officialTourSizes(S.days);
  S.loadedAt = Date.now();
  await loadResults();
}
// последние удачные данные не затираем, если Google не ответил
async function loadResults() {
  if (S.mode !== 'live') {
    S.chgk = SNAP.chgk?.overall || null; S.tourTabs = SNAP.chgk?.tours || {}; return;
  }
  const L = S.cfg.links;
  const open = [...ui.open].concat(ui.all ? standings()?.tours.map((_, k) => k) || [] : []);
  const [chgk, ksi, ek, ...tabs] = await Promise.all([getRows(L.chgk, 'Общий зачёт').then(r => r ?? getRows(L.chgk)), getRows(L.ksi, null, 1), getRows(L.ek, 'ЭК сетка', 0),
    ...[...new Set(open)].map(k => getRows(L.chgk, `${k + 1} тур`).then(r => [k, r]))]);
  S.chgk = chgk ?? S.chgk; S.ksi = ksi ?? S.ksi; S.ek = ek ?? S.ek;
  for (const [k, r] of tabs) if (r) S.tourTabs[k] = r;
  S.at = new Date();
}

/* ---------- Время в Валенсии ---------- */
function madridNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/Madrid', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).map(x => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, min: +p.hour * 60 + +p.minute };
}
function timeline() {
  const out = [];
  for (const d of S.days) d.items.forEach((it, i) => {
    const next = d.items[i + 1];
    out.push({ ...it, day: d, end: it.to ?? (next ? next.from : it.from + 60) });
  });
  return out;
}
const key = (date, min) => `${date} ${String(min).padStart(4, '0')}`;
function nowNext() {
  const now = madridNow(), tl = timeline(), k = key(now.date, now.min);
  const cur = tl.find(x => key(x.day.date, x.from) <= k && k < key(x.day.date, x.end));
  const nxt = tl.find(x => key(x.day.date, x.from) > k && x.kind !== 'break');
  return { cur, nxt, before: tl.length && k < key(tl[0].day.date, tl[0].from), after: tl.length && k >= key(tl.at(-1).day.date, tl.at(-1).end) };
}
function daysUntil(dateISO) {
  const now = madridNow();
  return Math.round((new Date(dateISO + 'T00:00:00Z') - new Date(now.date + 'T00:00:00Z')) / 864e5);
}
const firstSlot = kind => timeline().find(x => kind === 'chgk' ? /тур\s*ЧГК|ЧГК.*тур/i.test(x.title) : x.kind === kind);
const slotWhen = x => x ? `${x.day.weekday}, ${fmt(x.from)}` : '';

/* ---------- Результаты ЧГК: таблица организаторов ---------- */
// «Общий зачёт»: Место | Название команды | Город | ES | Всего | Тур 1…N | Перестрелка
function standings(zachet = '') {
  const rows = S.chgk; if (!rows) return null;
  const h = rows.findIndex(r => r.some(c => /назван|команд/i.test(c)) && r.some(c => /^(всего|сумма|итого)/i.test(String(c).trim())));
  if (h < 0) return null;
  const head = rows[h].map(c => String(c).trim());
  const idx = re => head.findIndex(c => re.test(c));
  const ci = { place: idx(/^мест/i), name: idx(/назван|команд/i), city: idx(/^город/i), es: idx(/^es$/i), total: idx(/^(всего|сумма|итого)/i), shoot: idx(/перестрел/i) };
  const tours = head.map((c, i) => ({ n: +(c.match(/^тур\s*(\d+)/i)?.[1] || 0), i })).filter(x => x.n);
  const meta = new Map(S.teams.map(x => [norm(x.name), x]));
  const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? null : n; };
  let list = rows.slice(h + 1).filter(r => String(r[ci.name] ?? '').trim()).map(r => {
    const name = String(r[ci.name]).trim().replace(/\*+$/, '').trim(), m = meta.get(norm(name));
    return { name, city: m?.city || (ci.city >= 0 ? String(r[ci.city] ?? '').trim() : ''), local: /валенс/i.test(m?.city || ''),
      es: ci.es >= 0 && String(r[ci.es] ?? '').trim() !== '', placeRaw: ci.place >= 0 ? num(r[ci.place]) : null,
      total: num(r[ci.total]) ?? 0, tours: tours.map(x => num(r[x.i])), shoot: ci.shoot >= 0 ? String(r[ci.shoot] ?? '').trim() : '' };
  });
  if (zachet === 'es') list = list.filter(x => x.es);
  list.sort((a, b) => (a.placeRaw ?? 1e9) - (b.placeRaw ?? 1e9) || b.total - a.total || a.name.localeCompare(b.name, 'ru'));
  const same = (a, b) => a.placeRaw != null ? a.placeRaw === b.placeRaw : a.total === b.total;
  for (let i = 0; i < list.length;) {
    let j = i; while (j < list.length && same(list[j], list[i])) j++;
    for (let k = i; k < j; k++) { list[k].pos = i + 1; list[k].placeText = j - i > 1 ? `${i + 1}–${j}` : `${i + 1}`; }
    i = j;
  }
  const played = tours.map((_, k) => list.some(x => x.tours[k]));
  return { tours: tours.map(x => x.n), list, played, hasShoot: list.some(x => x.shoot !== ''), hasEs: ci.es >= 0 && list.some(x => x.es) };
}
// вкладка «N тур»: № | Название команды | Итого | номера вопросов
function tourMarks(k) {
  const rows = S.tourTabs[k]; if (!rows) return null;
  const h = rows.findIndex(r => r.some(c => /назван|команд/i.test(c)));
  if (h < 0) return null;
  const head = rows[h].map(c => String(c).trim());
  const ni = head.findIndex(c => /назван|команд/i.test(c));
  const qs = head.map((c, i) => ({ q: c, i })).filter(x => /^\d+(\/\d+)?$/.test(x.q) && x.i > ni + 1);
  if (!qs.length) return null;
  const by = new Map(rows.slice(h + 1).filter(r => String(r[ni] ?? '').trim()).map(r => [norm(r[ni]), qs.map(x => String(r[x.i] ?? '').trim() === '1' ? 1 : 0)]));
  return { qs: qs.map(x => x.q), by };
}

/* ---------- КСИ: вкладка «КСИ итог» ---------- */
// № | Место | Команда | Σ | Σ+ | 1…10 (суммы по темам)
function ksiStandings() {
  const rows = S.ksi; if (!rows) return null;
  const h = rows.findIndex(r => r.some(c => /^команда$/i.test(String(c).trim())));
  if (h < 0) return null;
  const head = rows[h].map(c => String(c).trim());
  const ni = head.findIndex(c => /^команда$/i.test(c)), pi = head.findIndex(c => /^место$/i.test(c));
  let ti = head.findIndex(c => /^(σ|сумма|всего|итого)$/i.test(c));
  if (ti < 0 && head[ni + 1] === '') ti = ni + 1; // колонка суммы без заголовка сразу после команды
  const plusI = head.findIndex(c => /^σ\+$/i.test(c));
  const themes = head.map((c, i) => ({ n: c, i })).filter(x => /^\d+$/.test(x.n) && x.i > ni);
  if (ti < 0) return null;
  const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.')); return isNaN(n) ? null : n; };
  const meta = new Map(S.teams.map(x => [norm(x.name), x]));
  const list = rows.slice(h + 1).filter(r => String(r[ni] ?? '').trim() && !/^-+$/.test(String(r[ni]).trim())).map(r => {
    const name = String(r[ni]).trim(), m = meta.get(norm(name));
    return { name, city: m?.city || '', placeRaw: pi >= 0 ? num(r[pi]) : null, total: num(r[ti]) ?? 0,
      plus: plusI >= 0 ? String(r[plusI] ?? '').trim() : '', themes: themes.map(x => num(r[x.i])) };
  });
  // «Место» из таблицы, если заполнено; иначе — по сумме, равные суммы делят место
  const fromSheet = list.some(x => x.placeRaw != null);
  list.sort((a, b) => fromSheet ? (a.placeRaw ?? 1e9) - (b.placeRaw ?? 1e9) || b.total - a.total : b.total - a.total || a.name.localeCompare(b.name, 'ru'));
  const same = (a, b) => fromSheet ? a.placeRaw === b.placeRaw : a.total === b.total;
  for (let i = 0; i < list.length;) {
    let j = i; while (j < list.length && same(list[j], list[i])) j++;
    for (let k = i; k < j; k++) { list[k].pos = i + 1; list[k].placeText = fromSheet && list[k].placeRaw == null ? '' : j - i > 1 ? `${i + 1}–${j}` : `${i + 1}`; } // пустое/ошибочное «Место» в таблице — пустое и на сайте
    i = j;
  }
  return { themes: themes.map(x => x.n), list, hasPlus: list.some(x => x.plus !== ''), played: themes.map((_, k) => list.some(x => x.themes[k])) };
}

/* ---------- Эрудит-квартет: вкладка «ЭК сетка» ---------- */
// блоки «Четвертьфинал №1 - 16.00, Малый зал» → строки: Команда | Посев | Результат | Место
const EK_STAGES = ['четвертьфинал', 'полуфинал', 'финал'];
function ekGames() {
  const g = S.ek; if (!g) return null;
  const cell = (r, c) => String(g[r]?.[c] ?? '').trim();
  const games = [];
  for (let r = 0; r < g.length; r++) for (let c = 0; c < (g[r] || []).length; c++) {
    const m = cell(r, c).match(/^(четвертьфинал|полуфинал|финал)\s*(?:№\s*(\d+))?\s*(?:[-–—]\s*(\d{1,2})[.:](\d{2}))?\s*,?\s*(.*)$/i);
    if (!m) continue;
    const teams = [];
    for (let k = r + 1; k < g.length; k++) {
      const name = cell(k, c);
      if (/^(четвертьфинал|полуфинал|финал)/i.test(name)) break;
      if (/^команда$/i.test(name)) continue;
      if (!name) { if (teams.length) break; continue; }
      teams.push({ name: /^-+$/.test(name) ? '' : name, seed: cell(k, c + 1), result: cell(k, c + 2), place: cell(k, c + 3) });
    }
    games.push({ stage: m[1].toLowerCase(), num: m[2] || '', time: m[3] ? `${+m[3]}:${m[4]}` : '', hall: m[5] || '', teams });
  }
  if (!games.length) return null;
  return EK_STAGES.map(st => ({ stage: st, games: games.filter(x => x.stage === st).sort((a, b) => (+a.num || 0) - (+b.num || 0)) })).filter(x => x.games.length);
}
function ekBracket(stages) {
  const title = { 'четвертьфинал': 'Четвертьфиналы', 'полуфинал': 'Полуфиналы', 'финал': 'Финал' };
  // кто прошёл дальше — ровно те, кого сама сетка поставила в следующий этап (посев «Ч1-1», «П2-2» и т. п.)
  const next = { 'четвертьфинал': ['полуфинал', 'Ч'], 'полуфинал': ['финал', 'П'] };
  const advancing = (st, x) => {
    if (!next[st]) return null;
    const [nst, code] = next[st];
    const re = new RegExp(`^${code}\\s*${x.num}\\s*-\\s*[12]$`, 'i');
    const names = stages.filter(s => s.stage === nst).flatMap(s => s.games).flatMap(g => g.teams).filter(tm => re.test(tm.seed)).map(tm => norm(tm.name));
    return new Set(names);
  };
  const game = (st, x) => {
    const played = x.teams.some(tm => tm.result !== '' && parseFloat(tm.result) !== 0);
    const adv = advancing(st, x);
    const teams = played ? [...x.teams].sort((a, b) => (+a.place || 99) - (+b.place || 99)) : x.teams;
    return `<div class="card game">
      <div class="ghead"><b>${st === 'финал' ? 'Финал' : `${title[st].replace(/ы$/, '')} ${x.num}`}</b><span class="muted">${[x.time, x.hall].filter(Boolean).map(esc).join(' · ')}</span></div>
      ${teams.map(tm => {
        const isAdv = played && !!tm.name && (adv ? adv.has(norm(tm.name)) : +tm.place === 1);
        return `<div class="gteam ${isAdv ? 'adv' : ''}"><span class="gpl">${played && tm.place ? esc(tm.place) : ''}</span>
          <span class="gname">${tm.name ? esc(tm.name) : '<span class="muted">—</span>'}${tm.seed ? `<span class="city">посев ${esc(tm.seed)}</span>` : ''}</span>
          <span class="gres">${played ? esc(tm.result) : ''}</span></div>`;
      }).join('')}
    </div>`;
  };
  return `
    <div class="status"><span class="big">${S.mode === 'live' ? '<span class="live-dot" aria-hidden="true"></span>' : ''}Эрудит-квартет</span>${S.mode === 'live' && S.at ? `<span class="stamp">обновлено в ${hms(S.at)}</span>` : ''}</div>
    <div class="bracket">${stages.map(s => `<div class="stage"><h3>${title[s.stage]}</h3>${s.games.map(x => game(s.stage, x)).join('')}</div>`).join('')}</div>
    <p class="muted" style="font-size:.8rem">Из четвертьфиналов и полуфиналов дальше проходят две лучшие команды.</p>`;
}

function rulesHtml(txt) {
  const lines = txt.split(/\r?\n/).map(x => x.replace(/ /g, ' ').trim()).filter(Boolean);
  if (!lines.length) return '';
  const html = lines.map(l => l.length < 70 && !/[.;:,…»)]$/.test(l) && !/^[\d•*\-–—]/.test(l) ? `<h3>${t(l)}</h3>` : `<p>${t(l)}</p>`).join('');
  return `<details class="card rules"><summary>Читать правила</summary><div class="rules-body">${html}</div></details>`;
}

        <div>${c.eyebrow ? `<div class="eyebrow">${t(c.eyebrow)}</div>` : ''}${c.champ ? `<p class="champ">${t(c.champ)}</p>` : ''}</div>
        ${c.datesText ? `<div><span class="dates">${t(c.datesText)}</span></div>` : ''}
        ${c.venue ? `<div class="venue"><b>${t(c.venue)}, Валенсия</b>${c.map ? `<a href="${esc(c.map)}" target="_blank" rel="noopener">Открыть на карте</a>` : ''}</div>` : ''}
      </div>
    </div></section>
    <div class="wrap main">
      ${nowCard()}
      ${formButtons(['squads', 'reg'])}
      <nav class="tiles" aria-label="Разделы">
        <a class="tile" href="#results"><h2>Результаты</h2><p>ЧГК${N() ? ` — ${N()} ${plural(N(), 'тур', 'тура', 'туров')}` : ''}, КСИ, Эрудит-квартет</p></a>
        <a class="tile" href="#teams"><h2>Команды</h2><p>${teamsLine()}</p></a>
        <a class="tile" href="#schedule"><h2>Программа</h2><p>${t(cap(listJoin(days)))}: ЧГК, КСИ, Эрудит-квартет и «Кубок Риохи»</p></a>
        <a class="tile" href="#info"><h2>Инфо</h2><p>Правила, апелляции, кто проводит, советы гостям</p></a>
      </nav>
    </div>`;
  },

  schedule() {
    const { cur } = nowNext();
    const kinds = [['chgk', 'ЧГК'], ['ksi', 'Командная своя игра'], ['ek', 'Эрудит-квартет'], ['rioja', '«Кубок Риохи»']]
      .filter(([k]) => S.days.some(d => d.items.some(i => i.kind === k)));
    return `
    <div class="wrap main">
      <div class="page-head"><h1>Программа</h1><p class="sub">Время местное. Если место не указано — ${t(S.cfg.venue || 'на площадке турнира')}.</p></div>
      <div class="legend">${kinds.map(([k, l]) => `<span><i style="background:var(--k-${k})"></i>${l}</span>`).join('')}</div>
      ${S.days.map(d => `
        <section class="day"><h2>${t(d.label)}</h2>
          ${d.notes.map(n => `<p class="muted">${t(n)}</p>`).join('')}
          <div class="card slots">${d.items.map(it => {
            const isNow = cur && cur.day.date === d.date && cur.from === it.from && cur.title === it.title;
            return `<div class="slot k-${it.kind} ${isNow ? 'is-now' : ''}" ${isNow ? 'id="now-slot"' : ''}>
              <div class="t">${fmt(it.from)}${it.to ? `<span>до ${fmt(it.to)}</span>` : ''}</div>
              <div><h3>${t(it.title)}${isNow ? '<span class="live">сейчас</span>' : ''}</h3>${it.notes.map(n => `<p>${t(n)}</p>`).join('')}</div>
            </div>`;
          }).join('')}</div>
        </section>`).join('') || '<div class="card empty">Программа появится скоро.</div>'}
    </div>`;
  },

  teams() {
    return `
    <div class="wrap main">
      <div class="page-head"><h1>Команды</h1><p class="sub">Заявлено ${teamsLine().replace(/<\/?b>/g, '')}.${S.teams.some(x => x.id) ? ' Название со ссылкой ведёт на страницу команды на турнирном сайте.' : ''}</p></div>
      <input type="search" id="team-search" placeholder="Команда или город" aria-label="Поиск по командам">
      <div class="card teams" id="team-list">${S.teams.map((x, i) => {
        const where = [...new Set([x.city, x.country].filter(v => v && norm(v) !== 'сборная'))].join(', ') || (x.city || x.country ? 'Сборная' : '');
        const name = withBat(x.name, /валенс/i.test(x.city));
        return `<div class="team" data-q="${esc(norm(x.name + ' ' + x.city + ' ' + x.country))}">
          <span class="n">${i + 1}</span>
          <div class="name">${x.id ? `<a href="https://rating.chgk.info/teams/${x.id}" target="_blank" rel="noopener">${name}</a>` : name}${x.pending ? '<span class="pending">ждёт подтверждения</span>' : ''}</div>
          <div class="where">${esc(where)}</div>
        </div>`;
      }).join('')}
      <p class="empty" id="team-none" hidden>Никого не нашли.</p></div>
      ${S.teamNotes.length ? `<p class="muted" style="font-size:.85rem">${S.teamNotes.map(esc).join('<br>')}</p>` : ''}
      ${formButtons(['squads'])}
    </div>`;
  },

  results() {
    const sub = curPage() || 'results';
    const tabs = [['results', 'ЧГК'], ['ksi', 'КСИ'], ['ek', 'Эрудит-квартет']];
    let body = '';
    if (sub === 'results') body = `<div id="chgk-box" style="display:grid;gap:12px"></div>`;
    if (sub === 'ksi') {
      const f = firstSlot('ksi'), topics = f?.title.match(/\(([^)]*)\)/)?.[1];
      const ks = ksiStandings();
      body = ks ? ksiTable(ks) : S.ksi && S.ksi.length > 1 ? genericTable(S.ksi)
        : `<div class="card empty"><p><b>Командная своя игра</b>${f ? ` — ${esc(slotWhen(f))}` : ''}${topics ? `, ${t(topics)}` : ''}. Результаты появятся здесь после игры.</p></div>`;
    }
    if (sub === 'ek') {
      const games = timeline().filter(x => x.kind === 'ek');
      const stages = [];
      for (const g of games) {
        const [, stageName, rest] = g.title.replace(/^Эрудит-квартет\.\s*/i, '').match(/^(\D+?)(?:\s+(\d.*))?$/) || [, g.title, ''];
        const nums = (rest || '').match(/\d+/g) || [''];
        let st = stages.find(s => s.name === stageName); if (!st) stages.push(st = { name: stageName, games: [] });
        for (const n of nums) st.games.push({ label: n ? `${stageName.replace(/ы$/, '')} ${n}` : stageName, time: fmt(g.from) });
      }
      const ekg = ekGames();
      body = ekg ? ekBracket(ekg) : `<p class="muted">${games[0] ? `${t(games[0].day.label)}, с ${fmt(games[0].from)}.` : ''} Результаты появятся по ходу игр.</p>
        <div class="bracket">${stages.map(s => `<div class="stage"><h3>${t(s.name)}</h3><div class="card">${s.games.map(g => `<div class="match"><b>${t(g.label)}</b><span class="muted">${g.time}</span></div>`).join('')}</div></div>`).join('')}</div>`;
    }
    return `
    <div class="wrap main">
      <div class="page-head results-head"><h1>Результаты</h1></div>
      <nav class="seg" aria-label="Дисциплины">${tabs.map(([k, l]) => `<a href="#${k}" ${k === sub ? 'aria-current="page"' : ''}>${l}</a>`).join('')}</nav>
      ${body}
    </div>`;
  },

  info() {
    const c = S.cfg, R = SNAP.rating, st = standings();
    const tourDays = S.days.map(d => [d.weekday, d.items.filter(i => /тур\s*ЧГК/i.test(i.title)).length]).filter(([, n]) => n);
    const sizes = R.tours; // формат — с турнирного сайта (официальный)
    const total = sizes.reduce((a, b) => a + b, 0);
    const crew = [['Оргкомитет', R.orgcommittee], ['Редакторы', R.editors], ['Игровое жюри', R.gameJury], ['Апелляционное жюри', R.appealJury]].filter(([, v]) => v);
    const inDay = w => /а$/.test(w) ? w.replace(/а$/, 'у') : w;
    return `
    <div class="wrap main info">
      <div class="page-head"><h1>Инфо</h1></div>
      <nav class="toc" aria-label="На этой странице"><a href="#info" data-jump="i-rules">Правила</a><a href="#info" data-jump="i-appeals">Спорные и апелляции</a><a href="#info" data-jump="i-crew">Кто проводит</a><a href="#info" data-jump="i-guests">Гостям</a></nav>
      <section id="i-rules"><h2>Правила и регламенты</h2>
        ${S.rulesTxt ? rulesHtml(S.rulesTxt) : ''}
        ${c.links.rules ? `<a class="btn btn-soft" href="${esc(c.links.rules)}" target="_blank" rel="noopener">Открыть документ с правилами</a>` : '<p>Готовятся и появятся здесь.</p>'}
        ${sizes.length ? `<p>ЧГК: ${sizes.length} ${plural(sizes.length, 'тур', 'тура', 'туров')}, ${total} ${plural(total, 'вопрос', 'вопроса', 'вопросов')} (${sizes.join(' + ')})${tourDays.length ? `: ${tourDays.map(([d, n]) => `${n} ${plural(n, 'тур', 'тура', 'туров')} в ${inDay(d)}`).join(', ')}` : ''}.${st?.hasEs ? ' Кроме общего зачёта, есть испанский.' : ''}</p>` : ''}
      </section>
      <section id="i-appeals"><h2>Спорные и апелляции</h2>
        <p>Принимаются только апелляции на зачёт ответа. Апелляционное жюри судит по правилам КВРМ. В форме апелляции нужно оставить контакт для возврата апелляционного залога.</p>
        ${formButtons(['disputed', 'appeal'])}
      </section>
      <section id="i-crew"><h2>Кто проводит</h2>
        <dl class="card crew">${crew.map(([k, v]) => `<dt>${k}</dt><dd>${t(v)}</dd>`).join('')}</dl>
        <p class="muted" style="font-size:.85rem">По данным <a href="https://rating.chgk.info/tournament/${R.id}" target="_blank" rel="noopener">страницы турнира на rating.chgk.info</a>.</p>
      </section>
      <section id="i-forms"><h2>Формы</h2>${formButtons(['squads', 'reg'])}</section>
      <section id="i-guests"><h2>Гостям Валенсии</h2>
        <div class="tips">
          ${c.venue ? `<article class="card"><h3>Площадка</h3><p>${t(c.venue)}.${c.map ? ` <a href="${esc(c.map)}" target="_blank" rel="noopener">Открыть на карте</a>` : ''}</p></article>` : ''}
          <article class="card"><h3>Из аэропорта</h3><p>${t('Линии метро 3 и 5 идут из аэропорта в центр города, дорога около 25 минут.')} <a href="https://www.metrovalencia.es/" target="_blank" rel="noopener">metrovalencia.es</a></p></article>
          <article class="card"><h3>Какая она, паэлья валенсиана</h3><p>${t('Классическая валенсийская паэлья — с курицей, кроликом, плоской зелёной фасолью и крупной белой фасолью гарроф. Курица, фасоль и гарроф есть и на нашей афише. Паэлью едят на обед, а не на ужин.')}</p></article>
          <article class="card"><h3>Где попробовать</h3><p>${t('У пляжа Мальварроса — старые рестораны, где готовят паэлью, например La Pepica и Casa Carmela. Деревня Эль-Пальмар у озера Альбуфера считается родиной паэльи.')}</p></article>
          <article class="card"><h3>Почему на афише летучая мышь</h3><p>${t('Летучая мышь, rat penat, венчает герб Валенсии. На сайте ею отмечены команды из Валенсии.')}</p></article>
        </div>
      </section>
    </div>`;
  },
};

/* ---------- Роутер ---------- */
function route(fromNav = false) {
  const h = curPage(), page = ROUTES[h], c = S.cfg;
  document.title = page === 'home' ? c.name : `${({ schedule: 'Программа', teams: 'Команды', results: 'Результаты', info: 'Инфо' })[page]} · ${c.name}`;
  document.getElementById('brand').textContent = c.name.replace(/\s+—\s+\d{4}$/, '');
  document.querySelectorAll('[data-nav]').forEach(a => a.dataset.nav === page ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  const strip = document.getElementById('strip');
  strip.hidden = S.mode !== 'snapshot';
  if (S.mode === 'snapshot') strip.innerHTML = `<div class="wrap">Данные на ${new Date(SNAP.fetchedAt).toLocaleString('ru-RU', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' })}.</div>`;
  $app.innerHTML = pages[page]();
  if (h === 'results') renderChgk();
  if (page === 'teams') {
    const s = document.getElementById('team-search');
    s.oninput = () => {
      const q = norm(s.value); let shown = 0;
      document.querySelectorAll('#team-list .team').forEach(el => { el.hidden = !!q && !el.dataset.q.includes(q); if (!el.hidden) shown++; });
      document.getElementById('team-none').hidden = shown > 0;
    };
  }
  if (page === 'schedule' && fromNav) document.getElementById('now-slot')?.scrollIntoView({ block: 'center' });
  document.querySelectorAll('[data-jump]').forEach(a => a.onclick = e => { e.preventDefault(); document.getElementById(a.dataset.jump)?.scrollIntoView({ behavior: 'smooth' }); });
  document.getElementById('foot').innerHTML = `<span>${t(c.name)} · Валенсия${c.datesText ? ' · ' + t(c.datesText) : ''}</span><a href="https://rating.chgk.info/tournament/${SNAP.rating.id}" target="_blank" rel="noopener">Турнир на rating.chgk.info</a>`;
}

let ticks = 0, busy = false;
async function tick() {
  if (document.hidden || busy) return;
  busy = true;
  try { await tickBody(); } finally { busy = false; }
}
async function tickBody() {
  ticks++;
  if (S.mode === 'snapshot') { if (ticks % 2 === 0) { await loadBase(); if (S.mode === 'live') route(); } return; }
  const h = curPage();
  if (h === 'results' || h === 'ksi' || h === 'ek') {
    const before = JSON.stringify([S.chgk, S.ksi, S.ek, S.tourTabs]);
    const prev = standings();
    await loadResults();
    if (JSON.stringify([S.chgk, S.ksi, S.ek, S.tourTabs]) === before) { document.querySelectorAll('.stamp').forEach(st => { if (S.at) st.textContent = `обновлено в ${hms(S.at)}`; }); return; }
    if (prev) prevPos = new Map(prev.list.map(x => [x.name, x.pos]));
    h === 'results' ? renderChgk() : route();
  } else if (h === '' || h === 'schedule') {
    if (Date.now() - S.loadedAt > 300e3) await loadBase();
    route(); // «сейчас / далее» сдвигается со временем
  }
}
function loop() { setTimeout(async () => { try { await tick(); } finally { loop(); } }, (REFRESH_SEC + Math.random() * 10 - 5) * 1000); }

async function start() {
  document.documentElement.lang = 'ru';
  await loadBase();
  route(true);
  window.addEventListener('hashchange', async () => {
    if (S.mode === 'live' && Date.now() - S.loadedAt > 120e3) await loadBase();
    else if (curPage().match(/^(results|ksi|ek)$/)) await loadResults();
    window.scrollTo(0, 0); route(true);
  });
  loop();
  // вернулись на вкладку — обновляем сразу, не дожидаясь следующих 30 секунд
  document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
}
start();
</script>
